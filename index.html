<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랜두씨 다이어리</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
        .notice { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #007bff; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, select, button { padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .time-inputs { display: flex; gap: 10px; }
        .time-inputs input { flex: 1; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px; }
        button:hover { background: #0056b3; }
        .btn-sm { padding: 4px 8px; font-size: 12px; margin-right: 5px; display: inline-block; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-warning:hover { background: #e0a800; }
        .list-item { background: #f1f3f5; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .stat-box { background: #e9ecef; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; }
        .history-text { font-size: 12px; color: #6c757d; margin-top: 5px; }
        .badge { background: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div class="notice">
        ⚠️ 지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요.
    </div>

    <div class="card" id="seeSection">
        <h2>📊 돌아보기 (See)</h2>
        <div class="stats">
            <div class="stat-box">총 계획 수<br><span id="statPlans">0</span>건</div>
            <div class="stat-box">완료된 할 일<br><span id="statCompleted">0</span>건</div>
            <div class="stat-box">막힘/지연 수<br><span id="statBlocked">0</span>건</div>
            <div class="stat-box">예상 vs 실제<br><span id="statHours" style="font-size:15px;">0 / 0</span></div>
        </div>
    </div>

    <div class="card">
        <h2>📝 내 계획 (Plan) 관리</h2>
        <div class="input-group">
            <input type="text" id="planTitle" placeholder="새로운 계획 이름 (예: 자격증 공부)">
            <input type="text" id="planPeriod" placeholder="진행 기간 (예: 9/20 ~ 9/30)">
            <div class="time-inputs">
                <input type="number" id="planExpectedHours" placeholder="예상 시간 (시간)">
                <input type="number" id="planExpectedMinutes" placeholder="예상 시간 (분)">
            </div>
            <button onclick="addPlan()">+ 새 계획 만들기</button>
        </div>
        <div id="planList" style="margin-top: 20px; border-top: 2px dashed #eee; padding-top: 15px;">로딩 중...</div>
    </div>

    <div class="card">
        <h2>🏃 실제로 한 일 (Do)</h2>
        <div class="input-group">
            <select id="taskPlanSelect">
                <option value="">(연결할 계획을 선택하세요)</option>
            </select>
            <input type="text" id="taskName" placeholder="할 일 내용 입력">
            <div class="time-inputs">
                <input type="number" id="actualHours" placeholder="실제 소요 (시간)">
                <input type="number" id="actualMinutes" placeholder="실제 소요 (분)">
            </div>
            <input type="text" id="blockedReason" placeholder="막힌 이유 (없으면 비워두기)">
            <button onclick="addTask()">+ 할 일 추가 기록</button>
        </div>
        <div id="taskList" style="margin-top: 20px; border-top: 2px dashed #eee; padding-top: 15px;"></div>
    </div>

    <script>
        let plans = [];
        let tasks = [];

        function createElementWithText(tag, text) {
            const el = document.createElement(tag);
            el.textContent = text;
            return el;
        }

        async function apiCall(action, collection, data = null, id = null) {
            const res = await fetch('/api/db', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, collection, data, id })
            });
            return await res.json();
        }

        async function init() {
            plans = await apiCall('GET_ALL', 'plans');
            if (plans.length === 0) {
                const defaultPlan = {
                    title: "부모님과 오늘 있었던 일 이야기 나누기",
                    period: "2026-09-16 (수) ~ 2026-09-17 (목) 19:00~20:00",
                    expectedHours: 2,
                    expectedMinutes: 0,
                    successCriteria: "즐겁게 대화 마무리하기",
                    history: "[]"
                };
                await apiCall('ADD', 'plans', defaultPlan);
                plans = await apiCall('GET_ALL', 'plans');
            }
            tasks = await apiCall('GET_ALL', 'tasks');
            render();
        }

        async function addPlan() {
            const title = document.getElementById('planTitle').value;
            const period = document.getElementById('planPeriod').value;
            const expectedH = document.getElementById('planExpectedHours').value;
            const expectedM = document.getElementById('planExpectedMinutes').value;

            if (!title) return alert('계획 이름을 입력하세요.');

            const newPlan = {
                title: title,
                period: period || '-',
                expectedHours: Number(expectedH) || 0,
                expectedMinutes: Number(expectedM) || 0,
                successCriteria: "",
                history: "[]"
            };

            await apiCall('ADD', 'plans', newPlan);

            document.getElementById('planTitle').value = '';
            document.getElementById('planPeriod').value = '';
            document.getElementById('planExpectedHours').value = '';
            document.getElementById('planExpectedMinutes').value = '';

            plans = await apiCall('GET_ALL', 'plans');
            render();
        }

        async function editPlan(id) {
            const plan = plans.find(p => p.id === id);
            if(!plan) return;

            const newTitle = prompt('새로운 계획 이름을 입력하세요:', plan.title);
            if (!newTitle) return; 
            const newPeriod = prompt('새로운 기간을 입력하세요:', plan.period);
            const newExpectedH = prompt('새로운 예상 시간(시간)을 입력하세요:', plan.expectedHours || 0);
            const newExpectedM = prompt('새로운 예상 시간(분)을 입력하세요:', plan.expectedMinutes || 0);

            const historyData = plan.history ? JSON.parse(plan.history) : [];
            historyData.push({
                oldTitle: plan.title,
                oldPeriod: plan.period,
                oldExpectedH: plan.expectedHours,
                oldExpectedM: plan.expectedMinutes,
                changedAt: new Date().toISOString()
            });

            const updatedData = {
                title: newTitle,
                period: newPeriod || plan.period,
                expectedHours: Number(newExpectedH) || 0,
                expectedMinutes: Number(newExpectedM) || 0,
                history: JSON.stringify(historyData)
            };

            await apiCall('UPDATE', 'plans', updatedData, id);
            plans = await apiCall('GET_ALL', 'plans');
            render();
        }

        async function deletePlan(id) {
            if(!confirm('정말 이 계획을 삭제하시겠습니까? 연결된 할 일 데이터는 남지만 고립될 수 있습니다.')) return;
            await apiCall('DELETE', 'plans', null, id);
            plans = await apiCall('GET_ALL', 'plans');
            render();
        }

        async function addTask() {
            const planId = document.getElementById('taskPlanSelect').value;
            const name = document.getElementById('taskName').value;
            const hours = document.getElementById('actualHours').value;
            const mins = document.getElementById('actualMinutes').value;
            const blocked = document.getElementById('blockedReason').value;
            
            if (!planId) return alert('어떤 계획에 대한 일인지 먼저 위에서 선택해 주세요.');
            if (!name) return alert('할 일 내용을 입력하세요.');

            const newTask = {
                planId: planId, 
                taskName: name,
                actualHours: Number(hours) || 0,
                actualMinutes: Number(mins) || 0,
                blockedReason: blocked,
                isCompleted: true 
            };

            await apiCall('ADD', 'tasks', newTask);
            
            document.getElementById('taskName').value = '';
            document.getElementById('actualHours').value = '';
            document.getElementById('actualMinutes').value = '';
            document.getElementById('blockedReason').value = '';
            
            tasks = await apiCall('GET_ALL', 'tasks');
            render();
        }

        async function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if(!task) return;

            const newName = prompt('할 일 내용을 수정하세요:', task.taskName);
            if (!newName) return; 
            const newHours = prompt('실제 걸린 시간(시간)을 수정하세요:', task.actualHours || 0);
            const newMins = prompt('실제 걸린 시간(분)을 수정하세요:', task.actualMinutes || 0);
            const newBlocked = prompt('막힌 이유를 수정하세요:', task.blockedReason || '');

            const updatedData = {
                taskName: newName,
                actualHours: Number(newHours) || 0,
                actualMinutes: Number(newMins) || 0,
                blockedReason: newBlocked
            };

            await apiCall('UPDATE', 'tasks', updatedData, id);
            tasks = await apiCall('GET_ALL', 'tasks');
            render();
        }

        async function deleteTask(id) {
            if(!confirm('정말 이 기록을 삭제하시겠습니까?')) return;
            await apiCall('DELETE', 'tasks', null, id);
            tasks = await apiCall('GET_ALL', 'tasks');
            render();
        }

        function render() {
            const planListEl = document.getElementById('planList');
            planListEl.innerHTML = '';
            let totalExpectedMins = 0; // 통계용 총 예상 시간(분 단위 변환)

            plans.forEach(p => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.appendChild(createElementWithText('strong', p.title || '제목 없음'));
                
                const expH = p.expectedHours || 0;
                const expM = p.expectedMinutes || 0;
                div.appendChild(createElementWithText('p', `기간: ${p.period || '-'} / 예상: ${expH}시간 ${expM}분`));
                
                totalExpectedMins += (expH * 60) + expM;

                if (p.history && p.history !== "[]") {
                    const historyCount = JSON.parse(p.history).length;
                    const historyNotice = document.createElement('p');
                    historyNotice.className = 'history-text';
                    historyNotice.textContent = `📝 과거 수정 이력 ${historyCount}건이 서버에 보존되어 있습니다.`;
                    div.appendChild(historyNotice);
                }

                const btnGroup = document.createElement('div');
                btnGroup.style.marginTop = '10px';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'btn-sm btn-warning';
                editBtn.textContent = '수정';
                editBtn.onclick = () => editPlan(p.id);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-sm btn-danger';
                delBtn.textContent = '삭제';
                delBtn.onclick = () => deletePlan(p.id);

                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(delBtn);
                div.appendChild(btnGroup);
                planListEl.appendChild(div);
            });

            const taskPlanSelect = document.getElementById('taskPlanSelect');
            taskPlanSelect.innerHTML = '<option value="">(연결할 계획을 선택하세요)</option>';
            plans.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.title;
                taskPlanSelect.appendChild(option);
            });

            const taskListEl = document.getElementById('taskList');
            taskListEl.innerHTML = '';
            let totalActualMins = 0; // 통계용 총 실제 시간(분 단위 변환)
            let blockedCount = 0;

            tasks.forEach(t => {
                const div = document.createElement('div');
                div.className = 'list-item';
                
                const parentPlan = plans.find(p => p.id === t.planId);
                if (parentPlan) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = `[${parentPlan.title}]`;
                    div.appendChild(badge);
                    div.appendChild(document.createElement('br'));
                }

                div.appendChild(createElementWithText('strong', `✅ ${t.taskName}`));
                
                const actH = t.actualHours || 0;
                const actM = t.actualMinutes || 0;
                let detail = `소요 시간: ${actH}시간 ${actM}분`;
                
                totalActualMins += (actH * 60) + actM;

                if (t.blockedReason) {
                    detail += ` | 막힌 이유: ${t.blockedReason}`;
                    blockedCount++;
                }
                div.appendChild(createElementWithText('p', detail));
                
                const btnGroup = document.createElement('div');
                btnGroup.style.marginTop = '10px';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'btn-sm btn-warning';
                editBtn.textContent = '수정';
                editBtn.onclick = () => editTask(t.id);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-sm btn-danger';
                delBtn.textContent = '삭제';
                delBtn.onclick = () => deleteTask(t.id);

                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(delBtn);
                div.appendChild(btnGroup);

                taskListEl.appendChild(div);
            });

            document.getElementById('statPlans').textContent = plans.length;
            document.getElementById('statCompleted').textContent = tasks.length;
            document.getElementById('statBlocked').textContent = blockedCount;
            
            // 분을 다시 시간/분으로 예쁘게 쪼개서 통계에 출력
            const finalExpH = Math.floor(totalExpectedMins / 60);
            const finalExpM = totalExpectedMins % 60;
            const finalActH = Math.floor(totalActualMins / 60);
            const finalActM = totalActualMins % 60;

            document.getElementById('statHours').innerHTML = `예상 ${finalExpH}h ${finalExpM}m<br>실제 ${finalActH}h ${finalActM}m`;
        }

        init();
    </script>
</body>
</html>
